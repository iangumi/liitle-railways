name: Godot smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import and strictly validate scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s \
            godot --headless --path . --editor --import --quit \
            2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -Eiq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:' "$RUNNER_TEMP/godot-import.log"; then
            echo 'Godot script import failed despite the editor exit code.' >&2
            exit 1
          fi
      - name: Validate Android settings with Godot's parser
        run: timeout --signal=TERM --kill-after=5s 30s godot --headless --path . --script res://tests/android_preflight.gd

      - name: Verify generated audio reaches Master output
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 30s \
            godot --headless --path . --script res://tests/audio_test.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-audio.log"
          grep -Fq "PASS: generated sounds decode and horn reaches Master output" "$RUNNER_TEMP/godot-audio.log"

      - name: Smoke test driving and audio (90s hard limit)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            godot --headless --path . --script res://tests/smoke_test.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          grep -Fq "PASS v0.3: scene, train, sound, door safety, 10 trips, rewards, unlocks, save/load, replay" "$RUNNER_TEMP/godot-smoke.log"
