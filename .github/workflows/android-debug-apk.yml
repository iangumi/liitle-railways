name: Build Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Test and export APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      # GitHub-hosted ubuntu-latest includes an Android SDK and modern
      # command-line tools. android-actions/setup-android@v3 tries to install
      # the obsolete SDK package `tools`, which no longer exists and fails CI.
      - name: Install Godot 4.4 Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub runner must provide an Android SDK}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            for path in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; do
              if [[ -x "$path" ]]; then
                SDKMANAGER="$path"
                break
              fi
            done
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo 'Android sdkmanager is not installed on this runner' >&2
            exit 1
          fi
          echo "Using Android SDK $ANDROID_HOME and $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'build-tools;34.0.0' \
            'platforms;android-34'

      - name: Configure Godot Android SDK and debug signing
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$RUNNER_TEMP/android-signing"
          KEYSTORE="$RUNNER_TEMP/android-signing/debug.keystore"
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
            echo 'A temporary debug signing key was generated. Uninstall older APKs if Android refuses an update.'
          fi
          # Godot 4.4 stores settings in editor_settings-4.4.tres (not 4.tres).
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey'
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android'
          } >> "$GITHUB_ENV"

      - name: Validate project and Android preset
        run: python3 tools/verify_android_build.py

      - name: Import Godot assets and scripts
        run: godot --headless --path . --editor --import --quit

      - name: Run Godot gameplay smoke tests
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/little-railways-debug.apk
          test -s build/little-railways-debug.apk
          unzip -t build/little-railways-debug.apk | tail -1
          sha256sum build/little-railways-debug.apk | tee build/SHA256SUMS.txt
          ls -lh build/little-railways-debug.apk

      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: little-railways-v0.4-debug-apk
          path: |
            build/little-railways-debug.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
